<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Lançamento Tenis Nike Air</title>
  </head>
  <body class="w-full h-full overflow-hidden">
    <div
      class="w-full h-screen bg-slate-300 flex items-center justify-center p-3"
    >
      <main
        class="bg-white h-[540px] w-full max-w-4xl shadow-lg flex flex-col items-center justify-center md:flex-row"
      >
        <div
          class="w-full md:w-1/2 h-full flex items-center justify-center flex-col group"
        >
          <div class="w-full">
            <h3 class="hidden md:block text-sm ml-4 font-bold mt-4">
              Leo Gomes Developer
            </h3>
          </div>
          <div class="w-full h-full flex items-center justify-center">
            <div class="mb-2">
              <h1 class="text-5xl font-bold mb-2 select-none">
                Lançamento <br />
                <p class="group-hover:animate-floatRight">Nike Air.</p>
              </h1>
              <p class="mb-1 group-hover:animate-opacityPulse">
                O tênis do futuro
              </p>
              <p class="mb-7">O futuro a um passo do seu alcance!</p>
              <a
                href="#"
                class="font-bold bg-zinc-800 text-white py-2 px-5 border-2 border-zinc-800 duration-300 hover:bg-white hover:text-zinc-800"
              >
                QUERO CONHECER
              </a>
            </div>
          </div>
        </div>

        <!-- DIREITA -->
        <div
          class="w-full md:w-1/2 h-full items-center justify-center bg-tenis bg-no-repeat bg-center bg-cover"
        >
          <img
            src="assets/tenis.png"
            alt="tenis nike Air"
            class="max-w-lg w-11/12 md:max-w-full object-cover z-30 duration-300 hover:rotate-6 hover:scale-110 md:hover:scale-125"
          />
        </div>
      </main>
    </div>
  </body>
</html>
